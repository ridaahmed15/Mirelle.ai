<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e13"/><stop offset="1" stop-color="#10222a"/>
    </linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35d6b0"/><stop offset="1" stop-color="#9bafff"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#35d6b0" stop-opacity=".35"/><stop offset="1" stop-color="#35d6b0" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <circle cx="1020" cy="160" r="150" fill="url(#glow)">
    <animate attributeName="r" values="130;170;130" dur="5s" repeatCount="indefinite"/>
  </circle>
  <g fill="none" stroke="#35d6b0" stroke-opacity=".35">
    <circle cx="1020" cy="160" r="60"><animate attributeName="r" values="60;110;60" dur="4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".5;0;.5" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="160" r="90"><animate attributeName="r" values="90;140;90" dur="4s" begin="1.3s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".4;0;.4" dur="4s" begin="1.3s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#9bafff">
    <circle cx="880" cy="70" r="4"><animate attributeName="cy" values="70;90;70" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="90" r="3"><animate attributeName="cy" values="90;65;90" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="260" r="3"><animate attributeName="cy" values="260;240;260" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="240" r="4"><animate attributeName="cy" values="240;262;240" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>
  <circle cx="1020" cy="160" r="34" fill="#19b89a"/>
  <g fill="#07130f">
    <rect x="1002" y="146" width="36" height="28" rx="8"/>
  </g>
  <g fill="#19b89a">
    <circle cx="1012" cy="160" r="3.5"><animate attributeName="r" values="3.5;1;3.5" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1028" cy="160" r="3.5"><animate attributeName="r" values="3.5;1;3.5" dur="3s" repeatCount="indefinite"/></circle>
  </g>
  <text x="70" y="145" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="82" font-weight="700" fill="url(#ttl)" letter-spacing="4">MIRELLE</text>
  <text x="74" y="195" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#e8edf5">Your personal AI companion, 100% on your machine</text>
  <g transform="translate(74,232)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <rect width="104" height="30" rx="15" fill="#174d45"/><text x="52" y="20" text-anchor="middle" fill="#35d6b0">Local LLM</text>
    <rect x="116" width="104" height="30" rx="15" fill="#1d2a52"/><text x="168" y="20" text-anchor="middle" fill="#9bafff">Private</text>
    <rect x="232" width="132" height="30" rx="15" fill="#174d45"/><text x="298" y="20" text-anchor="middle" fill="#35d6b0">Smart Memory</text>
  </g>
  <circle cx="70" cy="40" r="5" fill="#35d6b0"><animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="84" y="45" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#38c99e" letter-spacing="2">LOCAL AI ONLINE</text>
</svg>
