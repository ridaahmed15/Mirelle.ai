<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#788696" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1000" height="360" rx="16" fill="#0b0e13"/>
  <g stroke="#788696" stroke-width="1.5" fill="none" stroke-dasharray="6 5" marker-end="url(#ah)">
    <path id="p1" d="M230 150 H 380"/>
    <path id="p2" d="M620 150 H 770"/>
    <path id="p3" d="M500 190 V 270"/>
  </g>
  <g>
    <rect x="40" y="100" width="190" height="100" rx="14" fill="#151b24" stroke="#35d6b0"/>
    <text x="135" y="140" text-anchor="middle" font-size="19" font-weight="700" fill="#35d6b0">Desktop UI</text>
    <text x="135" y="165" text-anchor="middle" font-size="13" fill="#8492a3">PySide6 + QThread</text>
    <text x="135" y="183" text-anchor="middle" font-size="12" fill="#657180">interface/main_window.py</text>
  </g>
  <g>
    <rect x="380" y="90" width="240" height="120" rx="14" fill="#151b24" stroke="#9bafff"/>
    <text x="500" y="132" text-anchor="middle" font-size="19" font-weight="700" fill="#9bafff">MirelleAI</text>
    <text x="500" y="158" text-anchor="middle" font-size="13" fill="#8492a3">Prompt + memory extraction</text>
    <text x="500" y="190" text-anchor="middle" font-size="12" fill="#657180">ai/ollama_client.py</text>
  </g>
  <g>
    <rect x="770" y="100" width="190" height="100" rx="14" fill="#151b24" stroke="#35d6b0"/>
    <text x="865" y="140" text-anchor="middle" font-size="19" font-weight="700" fill="#35d6b0">Ollama</text>
    <text x="865" y="165" text-anchor="middle" font-size="13" fill="#8492a3">qwen3:4b on localhost</text>
    <text x="865" y="183" text-anchor="middle" font-size="12" fill="#657180">:11434 /api/chat</text>
  </g>
  <g>
    <rect x="380" y="270" width="240" height="70" rx="14" fill="#151b24" stroke="#19b89a"/>
    <text x="500" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#19b89a">SQLite Memory</text>
    <text x="500" y="323" text-anchor="middle" font-size="12" fill="#657180">chat_history  |  user_facts</text>
  </g>
  <text x="305" y="138" text-anchor="middle" font-size="12" fill="#788696">message</text>
  <text x="695" y="138" text-anchor="middle" font-size="12" fill="#788696">prompt</text>
  <text x="512" y="236" font-size="12" fill="#788696">save / load</text>
  <g fill="#35d6b0">
    <circle r="5"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
  </g>
  <g fill="#9bafff">
    <circle r="5"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
  </g>
  <text x="500" y="40" text-anchor="middle" font-size="16" font-weight="600" fill="#e8edf5">Everything stays on your device</text>
  <rect x="20" y="60" width="960" height="1" fill="#202b37"/>
</svg>
